name: Daily Portfolio Stock Intelligence Briefing

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 05:00 실행 (UTC 기준 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 언제든 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Intelligence Crawler & AI Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler_runner.py

      - name: Commit and Push Updated Briefing Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefing_data.json data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Auto] Daily stock briefing updated ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))" && git push)
