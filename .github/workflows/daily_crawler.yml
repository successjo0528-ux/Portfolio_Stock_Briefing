name: Daily Portfolio Stock Intelligence Briefing

on:
  workflow_dispatch: # cron-job.org 외부 Webhook 및 수동 실행

# 중복 실행 방지 및 이전 진행 중인 작업 자동 취소
concurrency:
  group: portfolio-stock-briefing
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crawl-and-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Intelligence Crawler & AI Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler_runner.py

      - name: Commit and Push Updated Briefing Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefing_data.json data.js briefing_data.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "🤖 [Auto] Daily stock briefing updated ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
            git pull --rebase origin main || true
            git push origin main
          fi
